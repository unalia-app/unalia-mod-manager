# Audit: known vulnerabilities in the Rust dependencies, when `Cargo.lock`
# changes and every week (new advisories come without any push). Warnings
# (unmaintained crates) don't fail the job, vulnerabilities do.

name: Audit

on:
  push:
    branches: [main]
    paths: [Cargo.lock]
  pull_request:
    paths: [Cargo.lock]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
