# Release: a pushed `vX.Y.Z` tag builds the Windows installer and publishes
# the GitHub release. Nothing runs on other pushes (no test CI for now,
# tests run locally).
#
# Before setting the tag:
#   1. same version in `apps/desktop/src-tauri/tauri.conf.json`,
#      `apps/desktop/src-tauri/Cargo.toml` and `apps/desktop/package.json`;
#   2. `## [X.Y.Z]` section of `CHANGELOG.md` filled in (the release and
#      updater notes come from it);
#   3. `pnpm licenses:update`, and commit if `THIRD_PARTY_LICENSES.md` changes.
#
# GitHub repo settings, once:
#   - Settings > Environments > `release`: "Deployment branches and tags"
#     limited to `v*` tags, with the secrets `TAURI_SIGNING_PRIVATE_KEY`
#     (content of the `.key` file) and `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`.
#     Kept in the environment, they are only given to tag jobs;
#   - Settings > Rules > Rulesets: `v*` tags protected (creation, deletion
#     and update reserved to maintainers).

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    # GitHub Windows runner, full build without cache: a release is built
    # from scratch.
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # pnpm version read from `packageManager` (package.json).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the version
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME, but tauri.conf.json is at $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - run: pnpm install --frozen-lockfile

      # NSIS only: the updater and the uninstaller (hooks) rely on it.
      # Without the private key, no `.sig` and `updater-manifest.mjs` fails.
      # Executable signing (SignPath): to wire here through
      # `bundle.windows.signCommand`, to sign before the updater's `.sig`.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @modalia/desktop tauri build --bundles nsis

      # Installer under a fixed name, without spaces: the site points to
      # /releases/latest/download/unalia-mod-manager-setup.exe, and the updater
      # reads `latest.json` at the same URL (`tauri.conf.json`).
      # No `--prerelease`: GitHub would leave it out of /releases/latest.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $nsis = "target/release/bundle/nsis"
          $installer = "unalia-mod-manager-setup.exe"
          Copy-Item "$nsis/Unalia Mod Manager_${env:VERSION}_x64-setup.exe" $installer
          Copy-Item "$nsis/Unalia Mod Manager_${env:VERSION}_x64-setup.exe.sig" "$installer.sig"
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$installer"
          node scripts/updater-manifest.mjs --url $url --out latest.json --notes release-notes.md
          gh release create $env:GITHUB_REF_NAME $installer "$installer.sig" latest.json --title "Unalia Mod Manager $env:VERSION" --notes-file release-notes.md
