# Release : un tag `vX.Y.Z` poussé construit l'installeur Windows et publie
# la release GitLab. Rien ne tourne sur les autres pushes (CI de tests
# retirée pour l'instant, tests lancés en local).
#
# Avant de poser le tag :
#   1. même version dans `apps/desktop/src-tauri/tauri.conf.json`,
#      `apps/desktop/src-tauri/Cargo.toml` et `apps/desktop/package.json` ;
#   2. section `## [X.Y.Z]` de `CHANGELOG.md` remplie (les notes de version
#      de la release et de l'updater en viennent) ;
#   3. `pnpm licenses:update`, et commit si `THIRD_PARTY_LICENSES.md` change.
#
# Réglages du projet GitLab, une fois :
#   - Settings > Repository > Protected tags : `v*` ;
#   - Settings > CI/CD > Variables, « Protected » et « Masked » :
#     `TAURI_SIGNING_PRIVATE_KEY` (contenu du fichier `.key`) et
#     `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`. Protégées, elles ne sont données
#     qu'aux pipelines des tags protégés.

stages:
  - build
  - release

variables:
  # Registre de paquets génériques du projet : l'installeur, sa signature
  # et `latest.json` y restent, une version par tag.
  PACKAGE_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/unalia-mod-manager/${CI_COMMIT_TAG}

.release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

build:
  extends: .release-tag
  stage: build
  # Runner Windows partagé de GitLab.com (Windows Server 2022, PowerShell).
  # Démarrage lent (VM neuve à chaque job), build complet sans cache : une
  # release se construit de zéro.
  tags:
    - saas-windows-medium-amd64
  timeout: 1h 30m
  variables:
    CARGO_HOME: $CI_PROJECT_DIR\.cargo
    RUSTUP_HOME: $CI_PROJECT_DIR\.rustup
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
  before_script:
    - Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --no-modify-path --profile minimal --default-toolchain stable
    - $env:Path = "$env:CARGO_HOME\bin;$env:Path"
    - |
      if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
        choco install nodejs-lts -y --no-progress
        Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
        refreshenv
      }
    - npm install -g pnpm@10.17.0
    # Le dossier des commandes globales de npm n'est pas dans le PATH de l'image.
    - $env:Path = "$(npm prefix -g);$env:Path"
    - node -v; pnpm -v; cargo -V
  script:
    - $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
    - if ("v$version" -ne $env:CI_COMMIT_TAG) { throw "tag $env:CI_COMMIT_TAG, mais tauri.conf.json est en $version" }
    - pnpm install --frozen-lockfile
    # NSIS seulement : l'updater et le désinstalleur (hooks) reposent dessus.
    # La clé privée vient des variables de la CI : sans elle, pas de `.sig`
    # et le build échoue.
    # Signature de l'exécutable (SignPath) : à brancher ici par
    # `bundle.windows.signCommand`, pour signer avant le `.sig` de l'updater.
    - pnpm --filter @modalia/desktop tauri build --bundles nsis
    # Noms sans espace, exigés par le registre.
    - $nsis = "target/release/bundle/nsis"
    - $installer = "unalia-mod-manager_${version}_x64-setup.exe"
    - Copy-Item "$nsis/Unalia Mod Manager_${version}_x64-setup.exe" $installer
    - Copy-Item "$nsis/Unalia Mod Manager_${version}_x64-setup.exe.sig" "$installer.sig"
    - node scripts/updater-manifest.mjs --url "$env:PACKAGE_URL/$installer" --out latest.json --notes release-notes.md
    - 'curl.exe --fail-with-body --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file $installer "$env:PACKAGE_URL/$installer"'
    - 'curl.exe --fail-with-body --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file "$installer.sig" "$env:PACKAGE_URL/$installer.sig"'
    - 'curl.exe --fail-with-body --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file latest.json "$env:PACKAGE_URL/latest.json"'
    # Pour le job suivant. ASCII : PowerShell 5 écrit en UTF-16 par défaut.
    - Set-Content release.env "VERSION=$version`nINSTALLER=$installer" -Encoding ascii
  artifacts:
    paths:
      - release-notes.md
    reports:
      dotenv: release.env

release:
  extends: .release-tag
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - build
  script:
    - echo "Release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Unalia Mod Manager $VERSION
    description: ./release-notes.md
    assets:
      links:
        # Les `filepath` donnent des liens stables vers la dernière release :
        # /-/releases/permalink/latest/downloads/<filepath>. L'updater lit
        # `latest.json` à cette adresse (`tauri.conf.json`).
        - name: Windows installer
          url: ${PACKAGE_URL}/${INSTALLER}
          filepath: /unalia-mod-manager-setup.exe
          link_type: package
        - name: latest.json
          url: ${PACKAGE_URL}/latest.json
          filepath: /latest.json
          link_type: other
