# CI : tests sous Windows, la cible réelle de Modalia (SPEC §8).
# Le développement se fait sous macOS, où les tests tournent en local.
#
# Liens physiques, chemins `C:\`, registre, casse des noms de fichiers :
# tout ce qui diffère de macOS est vérifié ici à chaque push.

stages:
  - test

windows:
  stage: test
  # Runner Windows partagé de GitLab.com (Windows Server 2022, PowerShell).
  tags:
    - saas-windows-medium-amd64
  timeout: 1h
  variables:
    CARGO_HOME: $CI_PROJECT_DIR\.cargo
    RUSTUP_HOME: $CI_PROJECT_DIR\.rustup
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
  cache:
    # Recompiler les dépendances Rust prend l'essentiel du temps : on garde
    # le registre et `target/` tant que Cargo.lock ne change pas.
    key:
      files:
        - Cargo.lock
        - pnpm-lock.yaml
    paths:
      - .cargo/registry/
      - .cargo/git/
      - .rustup/
      - target/
  before_script:
    - |
      if (-not (Test-Path "$env:CARGO_HOME\bin\cargo.exe")) {
        Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
        .\rustup-init.exe -y --no-modify-path --profile minimal --default-toolchain stable -c clippy
      }
    - $env:Path = "$env:CARGO_HOME\bin;$env:Path"
    - rustup update stable --no-self-update
    - |
      if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
        choco install nodejs-lts -y --no-progress
        Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
        refreshenv
      }
    - npm install -g pnpm@10.17.0
    # Le dossier des commandes globales de npm n'est pas dans le PATH de l'image.
    - $env:Path = "$(npm prefix -g);$env:Path"
    - node -v; pnpm -v; cargo -V
  script:
    - pnpm install --frozen-lockfile
    # Tauri embarque l'interface à la compilation : il faut l'avoir construite.
    - pnpm --filter @modalia/desktop build
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace
