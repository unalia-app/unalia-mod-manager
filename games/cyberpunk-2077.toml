# Cyberpunk 2077: mods on Nexus Mods, placed by the REDengine adapter.
#
# Source ladder: a Nexus mod whose author publishes the same file on GitHub
# installs from GitHub, without a click on the site. The repo comes from
# the mod's description, or from `mirrors` below when the description
# doesn't mention it. Either way, Nexus must recognize the file's hash as
# this mod's: a wrong list can't install anything.
#
# The frameworks are published by their authors both on Nexus and on
# GitHub: Modalia installs them from GitHub, without a click on Nexus, as
# soon as a mod needs one. A framework is required when a file of the mod
# starts with one of the `needed_by_prefix` or ends with one of the
# `needed_by_ext`, or when Nexus declares it as a requirement.

id = "cyberpunk-2077"
name = "Cyberpunk 2077"
steam_app_ids = [1091500]
exe_names = ["bin/x64/Cyberpunk2077.exe"]
loader = "redengine"
# CD Projekt's launcher opens before the game: closed without playing, the
# launch is abandoned.
launchers = ["REDprelauncher.exe", "REDlauncher.exe"]

# Major versions of the game. Stayed on an old one (rolled back through
# Steam or GOG)? You get the mod files and framework releases published
# before the next one: 2.5 broke a lot of mods.
[[versions]]
name = "2.31"
released = "2025-09-11"

[[versions]]
name = "2.5"
released = "2026-10-22"

[nexus]
domain = "cyberpunk2077"
game_id = 3333

[[frameworks]]
name = "RED4ext"
nexus_id = 2380
github = "wopss/RED4ext"
asset = "red4ext-{version}.zip"
marker = "red4ext/RED4ext.dll"
needed_by_prefix = ["red4ext/plugins/"]

[[frameworks]]
name = "Cyber Engine Tweaks"
nexus_id = 107
github = "maximegmd/CyberEngineTweaks"
asset = "cet_{version}.zip"
marker = "bin/x64/plugins/cyber_engine_tweaks.asi"
needed_by_prefix = ["bin/x64/plugins/cyber_engine_tweaks/mods/"]

[[frameworks]]
name = "redscript"
nexus_id = 1511
github = "jac3km4/redscript"
asset = "redscript-v{version}-windows.zip"
marker = "engine/tools/scc.exe"
needed_by_ext = [".reds"]

[[frameworks]]
name = "ArchiveXL"
nexus_id = 4198
github = "psiberx/cp2077-archive-xl"
asset = "ArchiveXL-{version}.zip"
marker = "red4ext/plugins/ArchiveXL/ArchiveXL.dll"
needed_by_ext = [".xl"]

[[frameworks]]
name = "TweakXL"
nexus_id = 4197
github = "psiberx/cp2077-tweak-xl"
asset = "TweakXL-{version}.zip"
marker = "red4ext/plugins/TweakXL/TweakXL.dll"
needed_by_prefix = ["r6/tweaks/"]

[[frameworks]]
name = "Codeware"
nexus_id = 7780
github = "psiberx/cp2077-codeware"
asset = "Codeware-{version}.zip"
marker = "red4ext/plugins/Codeware/Codeware.dll"

[[mirrors]]
name = "Mod Settings"
nexus_id = 4885
github = "jackhumbert/mod_settings"
