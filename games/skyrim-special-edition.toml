# The Elder Scrolls V: Skyrim Special Edition (Creation Engine): mods on
# Nexus Mods, placed by the Bethesda adapter
# (`crates/mod-engine/src/loaders/bethesda.rs`). Everything goes into `Data/`.
#
# The game only loads the plugins listed in
# `%LOCALAPPDATA%\<plugins>\plugins.txt`: Modalia adds the ones it places.
# Steam version only (GOG and Epic have their own folder).

id = "skyrim-special-edition"
name = "The Elder Scrolls V: Skyrim Special Edition"
steam_app_ids = [489830]
exe_names = ["SkyrimSE.exe"]
loader = "bethesda"
plugins = "Skyrim Special Edition"
# Bethesda's launcher: opens before the game.
launchers = ["SkyrimSELauncher.exe"]

[nexus]
domain = "skyrimspecialedition"
game_id = 1704
