# Template for automatically recognized Unreal games: an Unreal game
# (project folder found on disk) whose name exists on Nexus Mods, without a
# hand-written profile in `games/`. Only the frameworks come from here, the
# rest is derived from the game (`crates/mod-engine/src/games/auto.rs`).
#
# UE4SS: Lua mods and Blueprint mods (LogicMods). The experimental build,
# published continuously, also handles recent Unreal 5 games.

[[frameworks]]
name = "UE4SS"
github = "UE4SS-RE/RE-UE4SS"
release = "experimental-latest"
asset = "UE4SS_v*.zip"
marker = "{binaries}/ue4ss/UE4SS.dll"
needed_by_prefix = [
    "{binaries}/ue4ss/Mods/",
    "{project}/Content/Paks/LogicMods/",
]
