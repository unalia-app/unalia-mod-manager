# Phantom Blade Zero (S-GAME, Unreal Engine 5), out on October 29, 2026.
#
# Profile prepared before release, with what is already certain: the Steam
# id, the Nexus page (already open) and Unreal 5 conventions (see
# `crates/mod-engine/src/loaders/unreal.rs`). The Unreal project folder is
# found on disk.
#
# To complete at release: `exe_names` (manually added game, Epic), and the
# UE4SS Nexus page for this game if one is created.

id = "phantom-blade-zero"
name = "Phantom Blade Zero"
steam_app_ids = [4115450]
loader = "unreal"

[nexus]
domain = "phantombladezero"
game_id = 10614

# UE4SS: Lua mods and Blueprint mods (LogicMods). The stable version
# (3.0.1, 2024) doesn't handle recent Unreal 5 games: we take the
# experimental build, published continuously.
[[frameworks]]
name = "UE4SS"
github = "UE4SS-RE/RE-UE4SS"
release = "experimental-latest"
asset = "UE4SS_v*.zip"
marker = "{project}/Binaries/Win64/ue4ss/UE4SS.dll"
needed_by_prefix = [
    "{project}/Binaries/Win64/ue4ss/Mods/",
    "{project}/Content/Paks/LogicMods/",
]
