# Phantom Blade Zero (S-GAME, Unreal Engine 5.7), out on October 29, 2026.
#
# Steam layout: `steam/PBZ.exe` is a small launcher that starts the real
# game, `platform/steam/PBZ.exe` (about 500 MB). The project folder is
# `ProjectPBZ` (`Content/Paks`), but its `Binaries/Win64` holds no
# executable: UE4SS goes next to the real one, found on disk
# (`{binaries}`, see `crates/mod-engine/src/loaders/unreal.rs`).

id = "phantom-blade-zero"
name = "Phantom Blade Zero"
steam_app_ids = [4115450]
# The launcher and the game have the same name.
exe_names = ["PBZ.exe"]
loader = "unreal"

[nexus]
domain = "phantombladezero"
game_id = 10614

# UE4SS: Lua mods and Blueprint mods (LogicMods). The official build starts
# no mod in this game (its engine fork moves core structures): this one is
# the official UE4SS with a config for the game (signatures,
# `MemberVariableLayout.ini`), published with its checksums by the author of
# its Nexus page ("UE4SS for PBZ").
[[frameworks]]
name = "UE4SS"
nexus_id = 13
github = "KintaroModding/ue4ss"
asset = "phantombladezero_ue4ss_v*.zip"
marker = "{binaries}/ue4ss/UE4SS.dll"
needed_by_prefix = [
    "{binaries}/ue4ss/Mods/",
    "{project}/Content/Paks/LogicMods/",
]
