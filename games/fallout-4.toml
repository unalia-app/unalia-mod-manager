# Fallout 4 (Creation Engine): mods on Nexus Mods, placed by the Bethesda
# adapter (`crates/mod-engine/src/loaders/bethesda.rs`). Everything goes
# into `Data/`.
#
# The game only loads the plugins listed in
# `%LOCALAPPDATA%\<plugins>\plugins.txt`: Modalia adds the ones it places.
# Steam version only (GOG and Epic have their own folder).

id = "fallout-4"
name = "Fallout 4"
steam_app_ids = [377160]
exe_names = ["Fallout4.exe"]
loader = "bethesda"
plugins = "Fallout4"
# Bethesda's launcher: opens before the game.
launchers = ["Fallout4Launcher.exe"]

[nexus]
domain = "fallout4"
game_id = 1151
