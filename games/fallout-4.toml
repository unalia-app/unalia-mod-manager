# Fallout 4 (Creation Engine) : mods sur Nexus Mods, placés par
# l'adaptateur Bethesda (`crates/mod-engine/src/loaders/bethesda.rs`). Tout
# va dans `Data/`.
#
# Le jeu ne charge que les plugins listés dans
# `%LOCALAPPDATA%\<plugins>\plugins.txt` : Modalia y ajoute ceux qu'il pose.
# Version Steam seulement (GOG et Epic ont leur propre dossier).

id = "fallout-4"
name = "Fallout 4"
steam_app_ids = [377160]
exe_names = ["Fallout4.exe"]
loader = "bethesda"
plugins = "Fallout4"
# Launcher de Bethesda : s'ouvre avant le jeu.
launchers = ["Fallout4Launcher.exe"]

[nexus]
domain = "fallout4"
game_id = 1151
