[package]
name = "modalia-desktop"
version = "0.1.2"
edition.workspace = true
publish = false
repository.workspace = true
description = "Appli de bureau Modalia"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "modalia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
log = { version = "0.4", default-features = false }
mod-engine.workspace = true
os_info = { version = "3", default-features = false }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-dialog = "2.8"
tauri-plugin-log = { version = "2", default-features = false }
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
# Without the `zip` feature: it only serves the old `.zip` artifacts
# (updater v1) and pulls `zip` 4, which is vulnerable (RUSTSEC-2026-0367 to
# 0369). On Windows, the artifact is the NSIS installer itself. Put it back
# for macOS and Linux (`.tar.gz`).
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { version = "1", features = ["macros", "time"] }
