[package]
name = "modalia-desktop"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "Appli de bureau Modalia"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows.
name = "modalia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
mod-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tokio = { version = "1", features = ["macros"] }
