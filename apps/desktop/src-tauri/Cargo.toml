[package]
name = "modalia-desktop"
version = "0.1.1"
edition.workspace = true
publish = false
repository.workspace = true
description = "Appli de bureau Modalia"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows.
name = "modalia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
log = { version = "0.4", default-features = false }
mod-engine.workspace = true
os_info = { version = "3", default-features = false }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-dialog = "2.8"
tauri-plugin-log = { version = "2", default-features = false }
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
# Sans la fonctionnalité `zip` : elle ne sert qu'aux anciens artefacts `.zip`
# (updater v1) et tire `zip` 4, vulnérable (RUSTSEC-2026-0367 à 0369). Sous
# Windows, l'artefact est l'installeur NSIS lui-même. À remettre pour macOS
# et Linux (`.tar.gz`).
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { version = "1", features = ["macros", "time"] }
