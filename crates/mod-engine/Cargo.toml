[package]
name = "mod-engine"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "Moteur de Modalia : détection des jeux, sources, loaders, déploiement des mods"

[dependencies]
fs4 = "1"
reqwest = { version = "0.13", features = ["json", "query", "gzip"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["bzip2", "ppmd"] }
toml = "1.1.8"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.28.0", features = ["v4"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress", "util"] }
mockito = "1.7"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
