# Licenses accepted for the Rust dependencies (`cargo about`, see
# `scripts/licenses.mjs`). A dependency under another license makes the
# generation fail: check that it is compatible with the GPL v3 before
# adding it here.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "bzip2-1.0.6",
]
# Only target shipped for now.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = false
ignore-dev-dependencies = true

# Our own crates (GPL v3, see LICENSE), not published.
[private]
ignore = true
