# Licences acceptées pour les dépendances Rust (`cargo about`, voir
# `scripts/licenses.mjs`). Une dépendance sous une autre licence fait
# échouer la génération : vérifier qu'elle est compatible avec la GPL v3
# avant de l'ajouter ici.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "bzip2-1.0.6",
]
# Seule cible livrée pour l'instant.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = false
ignore-dev-dependencies = true

# Nos propres crates (GPL v3, voir LICENSE), non publiées.
[private]
ignore = true
