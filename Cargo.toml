[workspace]
resolver = "3"
members = ["crates/mod-engine", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
repository = "https://gitlab.com/reverss/modalia"

[workspace.dependencies]
mod-engine = { path = "crates/mod-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
