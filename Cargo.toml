[workspace]
resolver = "3"
members = ["crates/mod-engine", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
repository = "https://github.com/unalia-app/unalia-mod-manager"

[workspace.dependencies]
mod-engine = { path = "crates/mod-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Reduced debug info: target/debug grew up to 30 GB.
# Backtraces keep files and lines for our code, not for the dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
