[workspace]
resolver = "3"
members = ["crates/mod-engine", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
repository = "https://gitlab.com/unalia/mod-manager"

[workspace.dependencies]
mod-engine = { path = "crates/mod-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Infos de debug réduites : target/debug grossissait jusqu'à 30 Go.
# Les backtraces gardent fichiers et lignes pour notre code, pas pour les dépendances.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
